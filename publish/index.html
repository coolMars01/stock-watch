<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>炒股工作台</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>炒股工作台</h1>
      <p class="sub">盯盘 · 记账 · 计划 · 复盘</p>
    </div>
    <div class="status">
      <div id="update-time">—</div>
      <div id="refresh-info"></div>
      <div id="sync-status"></div>
    </div>
  </header>

  <main>
    <section class="card access-card" id="access-card" hidden>
      <div class="card-head">
        <h2>📱 手机访问</h2>
      </div>
      <p class="access-tip">手机连上同一个 Wi-Fi，扫码或用浏览器打开下面的地址即可。</p>
      <div class="access-row">
        <img id="qr-img" alt="手机访问二维码" width="150" height="150">
        <div class="access-info">
          <div id="lan-url" class="lan-url"></div>
          <button id="copy-url" type="button" class="btn ghost">复制链接</button>
        </div>
      </div>
    </section>

    <nav class="tabs" id="tabs">
      <button type="button" class="tab active" data-tab="watch">盯盘</button>
      <button type="button" class="tab" data-tab="ledger">记账</button>
      <button type="button" class="tab" data-tab="plan">计划</button>
      <button type="button" class="tab" data-tab="review">复盘</button>
    </nav>

    <section class="card panel" id="panel-watch">
      <div class="card-head">
        <h2>盯盘</h2>
        <div class="toolbar">
          <button id="refresh-btn" type="button" class="btn ghost">刷新</button>
          <label class="select-field">刷新间隔
            <select id="refresh-interval">
              <option value="manual">手动</option>
              <option value="10">每10分钟</option>
              <option value="30">每30分钟</option>
              <option value="60">每小时</option>
              <option value="240">每4小时</option>
            </select>
          </label>
          <button id="export-btn" type="button" class="btn ghost">导出 CSV</button>
        </div>
      </div>
      <div class="summary" id="summary">共 0 只</div>

      <form id="add-form" class="add-form" autocomplete="off">
        <input id="new-code" placeholder="代码，如 600519 / 000001 / AAPL / 00700" required>
        <input id="new-expected" type="number" step="0.001" placeholder="我的预期(可选)">
        <input id="new-notes" placeholder="经验/备注(可选)">
        <button type="submit" class="btn">添加</button>
      </form>

      <div class="table-wrap">
        <table id="quote-table">
          <thead>
            <tr>
              <th>股票</th>
              <th>现价</th>
              <th>我的预期</th>
              <th>经验 / 备注</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="quote-body"></tbody>
        </table>
      </div>
      <div id="empty-tip" class="empty-tip">还没有自选股，在上方输入代码添加。</div>
    </section>

    <section class="card panel" id="panel-ledger" hidden>
      <div class="card-head">
        <h2>记账 · 持仓</h2>
        <button id="export-trades-btn" type="button" class="btn ghost">导出 CSV</button>
      </div>
      <div class="summary" id="portfolio-summary">还没有交易记录</div>

      <form id="trade-form" class="add-form" autocomplete="off">
        <input id="trade-code" placeholder="代码，如 600519 / AAPL" required>
        <select id="trade-side">
          <option value="buy">买入</option>
          <option value="sell">卖出</option>
        </select>
        <input id="trade-price" type="number" step="0.001" placeholder="价格" required>
        <input id="trade-qty" type="number" step="1" min="0" placeholder="数量" required>
        <input id="trade-date" type="date" required>
        <input id="trade-note" placeholder="备注(可选)">
        <button type="submit" class="btn">记一笔</button>
      </form>

      <h3 class="sub-head">当前持仓</h3>
      <div class="table-wrap">
        <table id="position-table">
          <thead>
            <tr>
              <th>股票</th>
              <th>持仓</th>
              <th>成本均价</th>
              <th>现价</th>
              <th>市值</th>
              <th>浮动盈亏</th>
            </tr>
          </thead>
          <tbody id="position-body"></tbody>
        </table>
      </div>
      <div id="position-empty" class="empty-tip">还没有持仓，先记一笔买入吧。</div>

      <h3 class="sub-head">交易记录</h3>
      <div class="table-wrap">
        <table id="trade-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>代码</th>
              <th>方向</th>
              <th>价格</th>
              <th>数量</th>
              <th>备注</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="trade-body"></tbody>
        </table>
      </div>
      <div id="trade-empty" class="empty-tip">还没有交易记录。</div>
    </section>

    <section class="card panel" id="panel-plan" hidden>
      <div class="card-head">
        <h2>计划</h2>
      </div>
      <form id="plan-form" class="add-form" autocomplete="off">
        <input id="plan-text" placeholder="计划内容，如：茅台回到 1300 加一手" required>
        <input id="plan-code" placeholder="关联代码(可选)">
        <button type="submit" class="btn">添加计划</button>
      </form>
      <ul id="plan-list" class="log-list"></ul>
    </section>

    <section class="card panel" id="panel-review" hidden>
      <div class="card-head">
        <h2>复盘 / 经验记录</h2>
      </div>
      <form id="log-form" class="add-form" autocomplete="off">
        <input id="log-text" placeholder="记录一条经验，例如：上次 800 附近没走，这次要设好止盈…" required>
        <button type="submit" class="btn">记录</button>
      </form>
      <ul id="log-list" class="log-list"></ul>
    </section>
  </main>

  <footer>行情数据来自腾讯财经，仅供参考，不构成投资建议；数据可能有延迟或误差。</footer>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
